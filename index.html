<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Minigames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --surface:#fff; --ink:#14213d; --muted:#5b6679; --line:#d9deea;
  --accent:#2447d8; --focus:#ff9f1c;
  --chem:#0d9488; --phys:#7c3aed; --bio:#16a34a; --math:#2563eb; --comp:#db2777; --hum:#d97706;
  --display:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;
  --body:"Figtree",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1526;--surface:#18203a;--ink:#e8ecf8;--muted:#9aa5c0;--line:#2a3558;--accent:#7b96ff}
}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

.hero{padding:64px 0 36px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,8vw,5.5rem);line-height:.95;margin:0 0 20px;letter-spacing:-.03em}
.hero p{max-width:52ch;font-size:1.1rem;color:var(--muted);margin:0}
.hero .count{display:inline-block;margin-top:20px;font-weight:600;color:var(--ink)}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search{flex:1 1 240px;padding:11px 14px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.92rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search:focus-visible,.chip:focus-visible,.card:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

main{padding:28px 0 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:6px;padding:20px 20px 18px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;color:inherit;text-decoration:none;min-height:150px}
.card:hover{border-color:var(--c);transform:translateY(-2px);transition:transform .15s}
.card .icon{font-size:1.9rem;line-height:1}
.card h2{font-family:var(--display);font-size:1.2rem;font-weight:500;margin:6px 0 0;line-height:1.2}
.card .tag{margin-top:auto;font-size:.85rem;font-weight:600;color:var(--c)}
.empty{display:none;padding:48px 0;text-align:center;color:var(--muted)}
footer{padding:28px 0 48px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.card:hover{transform:none;transition:none}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>Web Minigames</h1>
    <p>Short educational games I built during my internship. Pick a subject, choose a game and play in your browser.</p>
    <span class="count" id="count"></span>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <input class="search" id="search" type="search" placeholder="Search games" aria-label="Search games">
    <div class="chips" id="chips" role="group" aria-label="Filter by subject"></div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty">No games match. Clear the search or choose another subject.</p>
  </div>
</main>

<footer>
  <div class="wrap">
    Source code on <a href="https://github.com/wcheng-t12/Web-Minigames">GitHub</a>.
  </div>
</footer>

<script>
// Edit this list to add or recategorise games. "folder" is the game's directory name.
const SUBJECTS = {
  Chemistry:  "var(--chem)",
  Physics:    "var(--phys)",
  Biology:    "var(--bio)",
  Maths:      "var(--math)",
  Computing:  "var(--comp)",
  Others: "var(--hum)"
};

const GAMES = [
  ["Acid Base Sorter","acid-base-sorter-main","Chemistry","🧪"],
  ["Atom Builder","atom-builder-main","Chemistry","⚛️"],
  ["Chem Maze Runner","chem-maze-runner-main","Chemistry","🧫"],
  ["Lab Balance","lab-balance-main","Chemistry","⚖️"],
  ["Periodic Table Adventure","periodic-table-adventure-main","Chemistry","🗺️"],

  ["Circuit Builder","circuit-builder-main","Physics","🔌"],
  ["Force Puzzle Box","force-puzzle-box-main","Physics","📦"],
  ["Inertia Drift","inertia-drift-main","Physics","🏎️"],

  ["Cell Defender","cell-defender-main","Biology","🦠"],
  ["Farm Tycoon","farm-tycoon-main","Biology","🌾"],

  ["Capacity","capacity-main","Maths","🥛"],
  ["Cash Register","cash-register-main","Maths","💵"],
  ["Cosmic Math Defender","cosmic-math-defender-main","Maths","🚀"],
  ["Fraction Fortress","fraction-fortress-main","Maths","🏰"],
  ["Geo City","geo-city-main","Maths","🌍"],
  ["Grid Strike","grid-strike-main","Maths","🎯"],
  ["Mass and Temperature","mass-and-temp-main","Maths","🌡️"],
  ["Number Pipe Flow","number-pipe-flow-main","Maths","🔢"],
  ["Pattern and Probability","pattern-and-probability-main","Maths","🔷"],
  ["Probability Casino","probability-casino-main","Maths","🎲"],
  ["Robot Factory","robot-factory-main","Maths","🤖"],
  ["Target Number Catcher","target-number-catcher-main","Maths","🧲"],

  ["Algorithm Maze","algorithm-maze-main","Computing","🌀"],
  ["Debug Detectives","debug-detectives-main","Computing","🐞"],

  ["Hallway Hustle","hallway-hustle-main","Others","🏫"],
  ["Timeline Tactician","timeline-tactician-main","Others","⏳"],
  ["Word Warrior","word-warrior-main","Others","⚔️"]
].map(([name, folder, subject, icon]) => ({name, folder, subject, icon}));

const grid = document.getElementById("grid");
const chips = document.getElementById("chips");
const search = document.getElementById("search");
const count = document.getElementById("count");
const empty = document.getElementById("empty");
let active = "All";

function render() {
  const q = search.value.trim().toLowerCase();
  const list = GAMES.filter(g =>
    (active === "All" || g.subject === active) && g.name.toLowerCase().includes(q));
  grid.innerHTML = "";
  list.forEach(g => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = "./" + g.folder + "/";
    a.style.setProperty("--c", SUBJECTS[g.subject]);
    const icon = document.createElement("span");
    icon.className = "icon"; icon.textContent = g.icon; icon.setAttribute("aria-hidden", "true");
    const h = document.createElement("h2"); h.textContent = g.name;
    const t = document.createElement("span"); t.className = "tag"; t.textContent = g.subject;
    a.append(icon, h, t);
    grid.appendChild(a);
  });
  empty.style.display = list.length ? "none" : "block";
  count.textContent = list.length === GAMES.length
    ? GAMES.length + " games"
    : list.length + " of " + GAMES.length + " games";
}

["All", ...Object.keys(SUBJECTS)].forEach(s => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = s;
  b.setAttribute("aria-pressed", s === "All");
  b.addEventListener("click", () => {
    active = s;
    chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    render();
  });
  chips.appendChild(b);
});
search.addEventListener("input", render);
render();
</script>
</body>
</html>
