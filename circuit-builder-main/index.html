<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Circuit Builder ⚡</title>
<style>
  :root{
    --board:#0d1f1b;
    --board-2:#123128;
    --panel:#0a1614;
    --copper:#e3963e;
    --copper-2:#c97a2b;
    --live:#ffd166;
    --live-glow:#ffe9a8;
    --cool:#5fd9cd;
    --cool-dim:#2f5a54;
    --ink:#f4ede4;
    --ink-dim:#9fb3ad;
    --danger:#ef6a5f;
    --danger-2:#8f2f2a;
    --wire-off:#33534b;
    --radius:16px;
    --font-display: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: var(--font-display);
    background:
      radial-gradient(circle at 20% 10%, #163a32 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, #163a32 0%, transparent 40%),
      linear-gradient(160deg, #061210 0%, #0a1a17 55%, #06120f 100%);
    color:var(--ink);
    min-height:100%;
    overflow-x:hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #app{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 14px;
  }
  .screen{ display:none; width:100%; max-width:980px; flex-direction:column; align-items:center; animation: fadeIn .35s ease; }
  .screen.active{ display:flex; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- shared bits ---------- */
  .eyebrow{
    font-family:var(--font-mono);
    letter-spacing:.28em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--cool);
    opacity:.85;
  }
  h1.title{
    font-size: clamp(30px, 7vw, 52px);
    margin:6px 0 2px;
    letter-spacing: -0.01em;
    font-weight:800;
    background: linear-gradient(90deg, var(--live) 0%, var(--copper) 55%, var(--cool) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow: 0 0 30px rgba(255,209,102,.15);
  }
  p.sub{ color:var(--ink-dim); font-size:15px; max-width:520px; text-align:center; line-height:1.5; margin: 4px 0 18px;}
  .btn{
    font-family:var(--font-display);
    border:none; cursor:pointer;
    padding:14px 30px;
    border-radius: 999px;
    font-size:16px; font-weight:700;
    letter-spacing:.02em;
    background: linear-gradient(180deg, var(--live) 0%, var(--copper) 100%);
    color:#231404;
    box-shadow: 0 6px 0 var(--copper-2), 0 10px 22px rgba(227,150,62,.25);
    transition: transform .12s ease, box-shadow .12s ease;
    touch-action: manipulation;
  }
  .btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 var(--copper-2), 0 4px 10px rgba(227,150,62,.2); }
  .btn.ghost{
    background: transparent;
    color: var(--cool);
    box-shadow: inset 0 0 0 2px var(--cool-dim);
  }
  .btn.ghost:active{ box-shadow: inset 0 0 0 2px var(--cool); transform: translateY(2px);}
  .btn.small{ padding:9px 18px; font-size:13px; box-shadow: 0 4px 0 var(--copper-2);}
  .row{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

  .icon-btn{
    width:42px; height:42px; border-radius:50%;
    border: 2px solid var(--cool-dim);
    background: rgba(10,22,20,.6);
    color: var(--cool);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn svg{ width:20px; height:20px; }

  /* ---------- start screen ---------- */
  #screen-start .hero{ width:100%; max-width:560px; margin: 6px 0 8px; }
  .card{
    background: linear-gradient(180deg, rgba(18,49,40,.6), rgba(10,22,20,.75));
    border:1px solid rgba(95,217,205,.18);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  .top-bar{
    width:100%; max-width:980px;
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 6px;
  }

  /* ---------- instructions ---------- */
  .slide-wrap{
    width:100%; max-width:560px;
  }
  .slide{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding: 10px 6px 4px;
  }
  .slide.active{ display:flex; animation: fadeIn .3s ease; }
  .slide svg{ width:100%; max-width:380px; height:auto; margin-bottom:6px; }
  .slide h3{ margin: 6px 0 4px; font-size:19px; }
  .slide p{ color:var(--ink-dim); font-size:14px; line-height:1.5; max-width:400px; margin:0; }
  .dots{ display:flex; gap:8px; justify-content:center; margin: 14px 0; }
  .dot{ width:8px; height:8px; border-radius:50%; background: var(--wire-off); cursor:pointer; transition: background .2s, transform .2s;}
  .dot.active{ background: var(--live); transform: scale(1.3);}
  .slide-nav{ display:flex; justify-content:space-between; width:100%; align-items:center; }

  /* ---------- HUD ---------- */
  #screen-game{ max-width:1040px; }
  .hud{
    width:100%;
    display:flex;
    gap:8px;
    justify-content:space-between;
    align-items:stretch;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .lcd{
    background: linear-gradient(180deg,#0b1a13,#0a1512);
    border:1px solid rgba(255,209,102,.15);
    border-radius:10px;
    padding: 7px 14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-width:76px;
    box-shadow: inset 0 0 12px rgba(0,0,0,.6);
    position:relative;
    flex:1;
  }
  .lcd::after{
    content:"";
    position:absolute; inset:0; border-radius:10px;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .lcd .lbl{ font-family:var(--font-mono); font-size:9px; letter-spacing:.16em; color: var(--cool); text-transform:uppercase; opacity:.75;}
  .lcd .val{ font-family:var(--font-mono); font-size:22px; font-weight:700; color: var(--live); text-shadow: 0 0 8px rgba(255,209,102,.5); }
  .lcd.warn .val{ color: var(--danger); text-shadow: 0 0 8px rgba(239,106,95,.6); animation: pulseWarn .5s infinite; }
  @keyframes pulseWarn{ 50%{opacity:.4;} }
  .lives-row{ display:flex; gap:4px; margin-top:2px; }
  .life-bulb svg{ width:16px; height:16px; }
  .mute-wrap{ display:flex; align-items:center; }

  /* ---------- board ---------- */
  .board{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:14px;
  }
  .branch{ width:100%; }
  .branch-label{
    font-family:var(--font-mono);
    font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    color: var(--cool); margin-bottom:4px; padding-left:4px;
  }
  .branch-stage{
    position:relative;
    width:100%;
    border-radius: var(--radius);
    background:
      radial-gradient(circle, rgba(95,217,205,.08) 1px, transparent 1.4px) 0 0/18px 18px,
      linear-gradient(180deg, var(--board-2), var(--board));
    border: 1px solid rgba(95,217,205,.14);
    box-shadow: inset 0 0 30px rgba(0,0,0,.4);
    overflow:hidden;
  }
  .branch-svg{ display:block; width:100%; height:auto; }
  .wire{ stroke: var(--wire-off); stroke-width:7; stroke-linecap:round; fill:none; transition: stroke .35s, filter .35s; }
  .branch-svg.lit .wire{ stroke: var(--live); filter: drop-shadow(0 0 7px var(--live-glow)); }
  .term{ stroke: var(--ink-dim); stroke-width:7; stroke-linecap:round; fill:none; opacity:.9; }
  .batt-plus{ stroke:#e7d7b8; stroke-width:8; }
  .batt-minus{ stroke:#e7d7b8; stroke-width:5; }
  .bulb-glass{ fill:#16211f; stroke:var(--wire-off); stroke-width:4; transition: fill .35s, filter .35s; }
  .branch-svg.lit .bulb-glass{ fill:#ffe9a8; filter: drop-shadow(0 0 16px var(--live-glow)); }
  .bulb-filament{ stroke:#4a5f59; stroke-width:3; transition: stroke .35s;}
  .branch-svg.lit .bulb-filament{ stroke:#b3690f; }
  .flash-fail .wire, .flash-fail .bulb-glass{ animation: failFlash .5s ease; }
  @keyframes failFlash{ 0%,100%{ } 30%{ filter: drop-shadow(0 0 10px var(--danger)); stroke:var(--danger);} }

  .gap-overlay{ position:absolute; inset:0; pointer-events:none; }
  .gap-target{
    position:absolute;
    pointer-events:auto;
    cursor:grab;
    touch-action:none;
  }
  .gap-target svg{ width:100%; height:100%; overflow:visible; }
  .hint{ stroke: rgba(159,179,173,.55); stroke-width:4; stroke-dasharray:5 5; fill:none; }
  .hint-fill{ fill:none; stroke: rgba(159,179,173,.55); stroke-width:3.5; stroke-dasharray:4 5; }
  .gap-target.hover-match .hint, .gap-target.hover-match .hint-fill{ stroke: var(--live); }
  .gap-target.hover-mismatch .hint, .gap-target.hover-mismatch .hint-fill{ stroke: var(--danger); }
  .placed-wire{ stroke: var(--copper); stroke-width:7; stroke-linecap:round; }
  .placed-resistor-body{ fill:#3a2a17; stroke: var(--copper); stroke-width:3.5; }
  .placed-resistor-zig{ fill:none; stroke: var(--live); stroke-width:3.5; }
  .switch-base{ stroke: var(--copper); stroke-width:6; stroke-linecap:round; fill:none; }
  .switch-lever{ stroke: var(--live); stroke-width:6; stroke-linecap:round; transform-origin: var(--pivot-x) var(--pivot-y); transition: transform .25s ease; }
  .switch-dot{ fill: var(--copper); }
  .gap-target.pop svg{ animation: pop .32s ease; }
  @keyframes pop{ 0%{ transform:scale(.6);} 60%{ transform:scale(1.15);} 100%{ transform:scale(1);} }
  .gap-target.shake{ animation: shake .4s ease; }
  @keyframes shake{ 0%,100%{ transform:translateX(0);} 20%{ transform:translateX(-6px);} 40%{ transform:translateX(6px);} 60%{ transform:translateX(-4px);} 80%{ transform:translateX(4px);} }
  .filled{ cursor: default; }
  .switchable{ cursor:pointer; }

  /* ---------- tray ---------- */
  .tray{
    width:100%;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    background: rgba(10,22,20,.55);
    border:1px solid rgba(227,150,62,.2);
    border-radius: var(--radius);
    padding: 12px;
  }
  .tray-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    width:82px; padding:8px 4px;
    border-radius:12px;
    background: linear-gradient(180deg, rgba(227,150,62,.12), rgba(227,150,62,.03));
    border:1px solid rgba(227,150,62,.35);
    cursor:grab;
    touch-action:none;
    user-select:none;
  }
  .tray-item svg{ width:44px; height:32px; }
  .tray-item span{ font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; color: var(--ink-dim); text-transform:uppercase; }
  .drag-ghost{
    position:fixed; top:0; left:0; z-index:999;
    width:56px; height:40px;
    pointer-events:none;
    transform: translate(-50%,-50%);
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.5));
  }
  .drag-ghost svg{ width:100%; height:100%; }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; top:18%; left:50%; transform:translate(-50%,0);
    font-family:var(--font-mono); font-weight:700; font-size:26px;
    color: var(--live); text-shadow:0 0 12px rgba(255,209,102,.6);
    opacity:0; pointer-events:none; z-index: 998;
  }
  .toast.show{ animation: toastUp 1.5s ease forwards; }
  @keyframes toastUp{ 0%{ opacity:0; transform:translate(-50%,10px);} 15%{opacity:1; transform:translate(-50%,-6px);} 80%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-26px);} }

  /* ---------- end screen ---------- */
  .stars{ display:flex; gap:10px; margin: 14px 0; }
  .stars svg{ width:56px; height:56px; opacity:.25; transform:scale(.5); }
  .stars svg.won{ opacity:1; animation: starPop .5s ease forwards; }
  @keyframes starPop{ 0%{ transform:scale(.3) rotate(-15deg); opacity:0;} 60%{ transform:scale(1.25) rotate(6deg); opacity:1;} 100%{ transform:scale(1) rotate(0);} }
  .stat-row{ display:flex; gap:22px; justify-content:center; margin: 6px 0 18px; flex-wrap:wrap;}
  .stat{ text-align:center; }
  .stat .n{ font-family:var(--font-mono); font-size:24px; font-weight:700; color:var(--live); }
  .stat .l{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.14em; }

  footer.credit{ margin-top:18px; font-size:11px; color: var(--wire-off); text-align:center; }

  @media (max-width:520px){
    .lcd{ min-width:60px; padding:6px 8px;}
    .lcd .val{ font-size:18px; }
    .tray-item{ width:70px; }
    .tray-item svg{ width:36px; height:26px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- START SCREEN -->
  <section class="screen active" id="screen-start">
    <div class="top-bar">
      <span class="eyebrow">Physics · Electricity</span>
      <button class="icon-btn" id="muteBtnStart" title="Toggle sound"></button>
    </div>
    <div class="hero" id="startHero"></div>
    <h1 class="title">Circuit Builder</h1>
    <p class="sub">Drag wires, resistors, switches, LEDs, cells and capacitors into the open circuit to make the bulb glow. Match the shape, close the loop, beat the clock.</p>
    <div class="row">
      <button class="btn" id="playBtn">▶ Play</button>
      <button class="btn ghost" id="howToBtn">How to Play</button>
    </div>
  </section>

  <!-- INSTRUCTIONS -->
  <section class="screen" id="screen-instructions">
    <div class="top-bar">
      <span class="eyebrow">How to Play</span>
      <button class="icon-btn" id="closeInstrBtn">✕</button>
    </div>
    <div class="card slide-wrap" id="slideWrap"></div>
    <div class="dots" id="dots"></div>
    <div class="row">
      <button class="btn ghost small" id="prevSlide">◀ Back</button>
      <button class="btn small" id="nextSlide">Next ▶</button>
    </div>
    <div class="row" style="margin-top:14px;">
      <button class="btn" id="startFromInstr">⚡ Start Building</button>
    </div>
  </section>

  <!-- GAME -->
  <section class="screen" id="screen-game">
    <div class="hud">
      <div class="lcd"><span class="lbl">Round</span><span class="val" id="hudRound">1/10</span></div>
      <div class="lcd"><span class="lbl">Score</span><span class="val" id="hudScore">0</span></div>
      <div class="lcd">
        <span class="lbl">Lives</span>
        <div class="lives-row" id="hudLives"></div>
      </div>
      <div class="lcd" id="hudTimerBox"><span class="lbl">Time</span><span class="val" id="hudTimer">45</span></div>
      <div class="mute-wrap"><button class="icon-btn" id="muteBtnGame" title="Toggle sound"></button></div>
    </div>

    <div class="board" id="board"></div>
    <div class="tray" id="tray"></div>
  </section>

  <!-- END -->
  <section class="screen" id="screen-end">
    <span class="eyebrow" id="endEyebrow">Circuit Report</span>
    <h1 class="title" id="endTitle">Powered Up!</h1>
    <div class="stars" id="starsRow"></div>
    <div class="stat-row">
      <div class="stat"><div class="n" id="endScore">0</div><div class="l">Score</div></div>
      <div class="stat"><div class="n" id="endRound">0/10</div><div class="l">Rounds</div></div>
      <div class="stat"><div class="n" id="endLives">0</div><div class="l">Lives Left</div></div>
    </div>
    <div class="row">
      <button class="btn" id="playAgainBtn">🔁 Play Again</button>
      <button class="btn ghost" id="menuBtn">Menu</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   AUDIO ENGINE
============================================================ */
let audioCtx=null, masterGain=null, musicGain=null, musicTimer=null, muted=false;
function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted?0:1;
    masterGain.connect(audioCtx.destination);
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.16;
    musicGain.connect(masterGain);
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq,dur,type,vol,delay){
  if(!audioCtx) return;
  type = type||'sine'; vol = vol===undefined?0.2:vol; delay = delay||0;
  const t0 = audioCtx.currentTime+delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g).connect(masterGain);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
function sweep(f1,f2,dur,type,vol,delay){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime+(delay||0);
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type||'sawtooth';
  osc.frequency.setValueAtTime(f1,t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol||0.18,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g).connect(masterGain);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
function playPickup(){ ensureAudio(); tone(720,0.06,'triangle',0.14); }
function playCorrect(){ ensureAudio(); tone(720,0.09,'square',0.16); tone(1080,0.12,'square',0.14,0.07); }
function playWrong(){ ensureAudio(); tone(180,0.18,'sawtooth',0.16); tone(140,0.22,'sawtooth',0.12,0.05); }
function playToggle(){ ensureAudio(); tone(500,0.05,'square',0.12); }
function playBranchComplete(){ ensureAudio(); [660,880,1100].forEach((f,i)=>tone(f,0.14,'triangle',0.15,i*0.07)); }
function playRoundComplete(){ ensureAudio(); [523,659,784,1047].forEach((f,i)=>tone(f,0.16,'triangle',0.17,i*0.08)); }
function playLifeLost(){ ensureAudio(); sweep(340,90,0.4,'sawtooth',0.2); }
function playVictory(){ ensureAudio(); [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.22,'triangle',0.18,i*0.11)); }
function playGameOver(){ ensureAudio(); sweep(300,60,0.9,'sawtooth',0.18); }
function playStar(delay){ ensureAudio(); tone(900,0.14,'sine',0.16,delay); tone(1350,0.16,'sine',0.13,delay+0.09); }

const MUSIC_NOTES = [220,246.94,293.66,329.63,246.94,220,196,220];
let musicStep=0;
function scheduleMusic(){
  if(musicTimer) return;
  ensureAudio();
  function step(){
    if(!audioCtx) return;
    const f = MUSIC_NOTES[musicStep % MUSIC_NOTES.length];
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(0.1,t0+0.4);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+1.7);
    osc.connect(g).connect(musicGain);
    osc.start(t0); osc.stop(t0+1.8);
    musicStep++;
    musicTimer = setTimeout(step, 900);
  }
  step();
}
function toggleMute(){
  muted = !muted;
  ensureAudio();
  masterGain.gain.value = muted?0:1;
  document.querySelectorAll('.icon-btn[id^=muteBtn]').forEach(b=>b.innerHTML = muted?ICON_MUTE:ICON_SOUND);
}

/* ============================================================
   ICONS
============================================================ */
const ICON_SOUND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10v4h4l5 4V6L7 10H3z"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_MUTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10v4h4l5 4V6L7 10H3z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';

function bulbLifeIcon(alive){
  return '<svg viewBox="0 0 24 24">'+
    '<circle cx="12" cy="10" r="7" fill="'+(alive?'#ffd166':'#1c2b28')+'" stroke="'+(alive?'#e3963e':'#33534b')+'" stroke-width="1.6"/>'+
    (alive?'':'<line x1="7" y1="5" x2="17" y2="15" stroke="#ef6a5f" stroke-width="1.8"/>')+
    '<rect x="9" y="17" width="6" height="4" rx="1" fill="#9fb3ad"/>'+
  '</svg>';
}

function trayIcon(type){
  if(type==='wire'){
    return '<svg viewBox="0 0 60 40"><line x1="6" y1="20" x2="54" y2="20" stroke="#e3963e" stroke-width="6" stroke-linecap="round"/><circle cx="6" cy="20" r="4" fill="#e3963e"/><circle cx="54" cy="20" r="4" fill="#e3963e"/></svg>';
  }
  if(type==='resistor'){

/* ============================================================
   ROUND CONFIG
============================================================ */
const ROUNDS = [
  { time:45, branches:[ ['wire','wire'] ] },
  { time:42, branches:[ ['wire','resistor','wire'] ] },
  { time:40, branches:[ ['switch','wire','wire'] ] },
  { time:38, branches:[ ['resistor','switch','wire','resistor'] ] },
  { time:38, branches:[ ['wire','led','resistor','wire'] ], distractor:'capacitor' },
  { time:36, branches:[ ['switch','led','resistor','wire','cell'] ], distractor:'capacitor' },
  { time:44, branches:[ ['wire','resistor','led'], ['switch','wire'] ], distractor:'cell' },
  { time:42, branches:[ ['resistor','wire','cell','led'], ['switch','wire','resistor'] ], distractor:'capacitor' },
  { time:42, branches:[ ['switch','capacitor','resistor','led'], ['led','wire','cell','switch'] ] },
  { time:40, branches:[ ['wire','switch','resistor','led','cell'], ['capacitor','wire','cell','switch','resistor'] ] }
];
function totalGapsOf(cfg){ return cfg.branches.reduce((s,b)=>s+b.length,0); }
function roundBaseScore(cfg){ return 60 + 18*totalGapsOf(cfg); }
const MAX_SCORE = ROUNDS.reduce((s,r)=>s+roundBaseScore(r)+r.time*4,0);
const START_LIVES = 3;
const TYPE_ORDER = ['wire','resistor','switch','led','cell','capacitor'];
function needsToggle(t){ return t==='switch' || t==='led'; }
function initialClosed(t){ if(t==='switch') return false; if(t==='led') return Math.random()<0.5; return true; }

/* ============================================================
   STATE
============================================================ */
const state = {
  round:0, score:0, lives:START_LIVES, timeLeft:0,
  timerHandle:null, wrongAttempts:0, branchStates:[], roundCompleting:false,
  dragging:null
};

const boardEl = document.getElementById('board');
const trayEl = document.getElementById('tray');
const toastEl = document.getElementById('toast');

/* ============================================================
   BRANCH SVG GEOMETRY
============================================================ */
const VBW=900, VBH=260, BATT_X=70, BULB_X=830, MID_Y=130, TOP_Y=40, BOT_Y=220;
const GAP_HW=42, GAP_HH=28;

function gapPositions(n){
  const arr=[];
  for(let i=0;i<n;i++){
    arr.push(BATT_X + (BULB_X-BATT_X) * (i+1)/(n+1));
  }
  return arr;
}

function hintSVG(type, size){
  const w = size||84, h=56, cx=w/2, cy=h/2;
  if(type==='wire'){

  }
  if(type==='resistor'){
    return '<svg viewBox="0 0 '+w+' '+h+'"><line class="hint" x1="4" y1="'+cy+'" x2="16" y2="'+cy+'"/><line class="hint" x1="'+(w-16)+'" y1="'+cy+'" x2="'+(w-4)+'" y2="'+cy+'"/><rect class="hint-fill" x="16" y="'+(cy-11)+'" width="'+(w-32)+'" height="22" rx="4"/></svg>';
  }
  if(type==='switch'){
    return '<svg viewBox="0 0 '+w+' '+h+'"><line class="hint" x1="4" y1="'+(cy+6)+'" x2="16" y2="'+(cy+6)+'"/><line class="hint" x1="'+(w-16)+'" y1="'+(cy+6)+'" x2="'+(w-4)+'" y2="'+(cy+6)+'"/><circle class="hint" cx="16" cy="'+(cy+6)+'" r="3"/><circle class="hint" cx="'+(w-16)+'" cy="'+(cy+6)+'" r="3"/><line class="hint" x1="16" y1="'+(cy+6)+'" x2="'+(w-20)+'" y2="'+(cy-14)+'"/></svg>';
  }
  if(type==='led'){
    return '<svg viewBox="0 0 '+w+' '+h+'"><line class="hint" x1="6" y1="'+cy+'" x2="'+(cx-10)+'" y2="'+cy+'"/><line class="hint" x1="'+(cx+8)+'" y1="'+cy+'" x2="'+(w-6)+'" y2="'+cy+'"/><polyline class="hint" points="'+(cx-10)+','+(cy-9)+' '+(cx-10)+','+(cy+9)+' '+(cx+8)+','+cy+' '+(cx-10)+','+(cy-9)+'"/><line class="hint" x1="'+(cx+8)+'" y1="'+(cy-10)+'" x2="'+(cx+8)+'" y2="'+(cy+10)+'"/></svg>';
  }
  if(type==='cell'){
    return '<svg viewBox="0 0 '+w+' '+h+'"><line class="hint" x1="6" y1="'+cy+'" x2="'+(cx-10)+'" y2="'+cy+'"/><line class="hint" x1="'+(cx+10)+'" y1="'+cy+'" x2="'+(w-6)+'" y2="'+cy+'"/><line class="hint" x1="'+(cx-10)+'" y1="'+(cy-10)+'" x2="'+(cx-10)+'" y2="'+(cy+10)+'"/><line class="hint" x1="'+(cx+10)+'" y1="'+(cy-5)+'" x2="'+(cx+10)+'" y2="'+(cy+5)+'"/></svg>';
  }
  if(type==='capacitor'){
    return '<svg viewBox="0 0 '+w+' '+h+'"><line class="hint" x1="6" y1="'+cy+'" x2="'+(cx-6)+'" y2="'+cy+'"/><line class="hint" x1="'+(cx+6)+'" y1="'+cy+'" x2="'+(w-6)+'" y2="'+cy+'"/><line class="hint" x1="'+(cx-6)+'" y1="'+(cy-11)+'" x2="'+(cx-6)+'" y2="'+(cy+11)+'"/><line class="hint" x1="'+(cx+6)+'" y1="'+(cy-11)+'" x2="'+(cx+6)+'" y2="'+(cy+11)+'"/></svg>';
  }
  return '';
}

function filledSVG(type, closed, size){
  const w = size||84, h=56, cy=h/2;
  if(type==='wire'){
    return '<svg viewBox="0 0 '+w+' '+h+'"><line class="placed-wire" x1="6" y1="'+cy+'" x2="'+(w-6)+'" y2="'+cy+'"/></svg>';
  }
  if(type==='resistor'){
    return '<svg viewBox="0 0 '+w+' '+h+'"><line class="placed-wire" x1="2" y1="'+cy+'" x2="16" y2="'+cy+'"/><line class="placed-wire" x1="'+(w-16)+'" y1="'+cy+'" x2="'+(w-2)+'" y2="'+cy+'"/><rect class="placed-resistor-body" x="16" y="'+(cy-12)+'" width="'+(w-32)+'" height="24" rx="4"/><polyline class="placed-resistor-zig" points="20,'+cy+' 24,'+(cy-9)+' 30,'+(cy+9)+' 36,'+(cy-9)+' 42,'+(cy+9)+' 48,'+(cy-9)+' '+(w-20)+','+cy+'"/></svg>';
  }
  if(type==='switch'){
    const pivotX=16, pivotY=cy;
    const rot = closed? 'rotate(-24deg)' : 'rotate(0deg)';
    return '<svg viewBox="0 0 '+w+' '+h+'"><line class="switch-base" x1="2" y1="'+cy+'" x2="16" y2="'+cy+'"/><line class="switch-base" x1="'+(w-16)+'" y1="'+cy+'" x2="'+(w-2)+'" y2="'+cy+'"/>'+
      '<line class="switch-lever" style="--pivot-x:'+pivotX+'px;--pivot-y:'+pivotY+'px; transform:'+rot+';" x1="'+pivotX+'" y1="'+pivotY+'" x2="'+(w-18)+'" y2="'+pivotY+'"/>'+
      '<circle class="switch-dot" cx="'+pivotX+'" cy="'+pivotY+'" r="4.2"/><circle class="switch-dot" cx="'+(w-16)+'" cy="'+cy+'" r="3.2"/></svg>';
  }
  if(type==='led'){
    const cx=w/2;
    const rot = closed? 0 : 180;
    return '<svg viewBox="0 0 '+w+' '+h+'"><line class="placed-wire" x1="6" y1="'+cy+'" x2="'+(cx-10)+'" y2="'+cy+'"/><line class="placed-wire" x1="'+(cx+8)+'" y1="'+cy+'" x2="'+(w-6)+'" y2="'+cy+'"/>'+
      '<g style="transform:rotate('+rot+'deg); transform-origin:'+cx+'px '+cy+'px; transition: transform .3s ease;">'+
      '<polygon points="'+(cx-10)+','+(cy-9)+' '+(cx-10)+','+(cy+9)+' '+(cx+8)+','+cy+'" fill="#ffd166" stroke="#e3963e" stroke-width="1.5"/>'+
      '<line x1="'+(cx+8)+'" y1="'+(cy-10)+'" x2="'+(cx+8)+'" y2="'+(cy+10)+'" stroke="#e3963e" stroke-width="3"/>'+
      '</g></svg>';
  }
  if(type==='cell'){
    const cx=w/2;
    return '<svg viewBox="0 0 '+w+' '+h+'"><line class="placed-wire" x1="6" y1="'+cy+'" x2="'+(cx-10)+'" y2="'+cy+'"/><line class="placed-wire" x1="'+(cx+10)+'" y1="'+cy+'" x2="'+(w-6)+'" y2="'+cy+'"/>'+
      '<line x1="'+(cx-10)+'" y1="'+(cy-10)+'" x2="'+(cx-10)+'" y2="'+(cy+10)+'" stroke="#e7d7b8" stroke-width="3"/>'+
      '<line x1="'+(cx+10)+'" y1="'+(cy-5)+'" x2="'+(cx+10)+'" y2="'+(cy+5)+'" stroke="#e7d7b8" stroke-width="6"/></svg>';
  }
  if(type==='capacitor'){
    const cx=w/2;
    return '<svg viewBox="0 0 '+w+' '+h+'"><line class="placed-wire" x1="6" y1="'+cy+'" x2="'+(cx-6)+'" y2="'+cy+'"/><line class="placed-wire" x1="'+(cx+6)+'" y1="'+cy+'" x2="'+(w-6)+'" y2="'+cy+'"/>'+
      '<line x1="'+(cx-6)+'" y1="'+(cy-11)+'" x2="'+(cx-6)+'" y2="'+(cy+11)+'" stroke="#ffd166" stroke-width="4"/>'+
      '<line x1="'+(cx+6)+'" y1="'+(cy-11)+'" x2="'+(cx+6)+'" y2="'+(cy+11)+'" stroke="#ffd166" stroke-width="4"/></svg>';
  }
  return '';
}

function renderBranchMarkup(gapsArr, bIdx){
  const n = gapsArr.length;
  const xs = gapPositions(n);
  // build wire segments (broken at gaps)
  let segs = [];
  let prev = BATT_X;
  xs.forEach(x=>{ segs.push([prev, x-GAP_HW]); prev = x+GAP_HW; });
  segs.push([prev, BULB_X]);

  let wireLines = segs.map(s=> '<line class="wire" x1="'+s[0]+'" y1="'+TOP_Y+'" x2="'+s[1]+'" y2="'+TOP_Y+'"/>').join('');

  const svgParts = [];
  // bottom return wire (fixed)
  svgParts.push('<line class="wire" x1="'+BATT_X+'" y1="'+BOT_Y+'" x2="'+BULB_X+'" y2="'+BOT_Y+'"/>');
  // left vertical wires around battery
  svgParts.push('<line class="term" x1="'+BATT_X+'" y1="'+TOP_Y+'" x2="'+BATT_X+'" y2="'+(MID_Y-16)+'"/>');
  svgParts.push('<line class="term" x1="'+BATT_X+'" y1="'+(MID_Y+16)+'" x2="'+BATT_X+'" y2="'+BOT_Y+'"/>');
  // right vertical wires around bulb
  svgParts.push('<line class="term" x1="'+BULB_X+'" y1="'+TOP_Y+'" x2="'+BULB_X+'" y2="'+(MID_Y-24)+'"/>');
  svgParts.push('<line class="term" x1="'+BULB_X+'" y1="'+(MID_Y+24)+'" x2="'+BULB_X+'" y2="'+BOT_Y+'"/>');
  // top wire segments
  svgParts.push(wireLines);
  // battery symbol
  svgParts.push('<line class="batt-plus" x1="'+(BATT_X-16)+'" y1="'+(MID_Y-9)+'" x2="'+(BATT_X+16)+'" y2="'+(MID_Y-9)+'"/>');
  svgParts.push('<line class="batt-minus" x1="'+(BATT_X-9)+'" y1="'+(MID_Y+9)+'" x2="'+(BATT_X+9)+'" y2="'+(MID_Y+9)+'"/>');
  svgParts.push('<text x="'+(BATT_X+26)+'" y="'+(MID_Y-4)+'" fill="#e7d7b8" font-size="14" font-family="ui-monospace,monospace">+</text>');
  // bulb symbol
  svgParts.push('<circle class="bulb-glass" cx="'+BULB_X+'" cy="'+MID_Y+'" r="23"/>');
  svgParts.push('<line class="bulb-filament" x1="'+(BULB_X-11)+'" y1="'+(MID_Y-11)+'" x2="'+(BULB_X+11)+'" y2="'+(MID_Y+11)+'"/>');
  svgParts.push('<line class="bulb-filament" x1="'+(BULB_X-11)+'" y1="'+(MID_Y+11)+'" x2="'+(BULB_X+11)+'" y2="'+(MID_Y-11)+'"/>');

  const svgInner = svgParts.join('');

  const gapDivs = xs.map((x,i)=>{
    const left = ((x-GAP_HW)/VBW*100).toFixed(2);
    const top = ((TOP_Y-GAP_HH)/VBH*100).toFixed(2);
    const wpct = (GAP_HW*2/VBW*100).toFixed(2);
    const hpct = (GAP_HH*2/VBH*100).toFixed(2);
    return '<div class="gap-target" data-branch="'+bIdx+'" data-gap="'+i+'" data-type="'+gapsArr[i]+'" '+
      'style="left:'+left+'%; top:'+top+'%; width:'+wpct+'%; height:'+hpct+'%;">'+hintSVG(gapsArr[i])+'</div>';
  }).join('');

  return '<div class="branch-stage"><svg class="branch-svg" data-branch="'+bIdx+'" viewBox="0 0 '+VBW+' '+VBH+'">'+svgInner+'</svg>'+
    '<div class="gap-overlay">'+gapDivs+'</div></div>';
}

/* ============================================================
   BOARD BUILD
============================================================ */
function buildBoard(){
  const cfg = ROUNDS[state.round];
  state.branchStates = cfg.branches.map(gapsArr=>({
    gaps: gapsArr.map(t=>({type:t, filled:false, closed: initialClosed(t)})),
    wasLit:false
  }));
  state.roundCompleting = false;
  state.wrongAttempts = 0;

  boardEl.innerHTML = '';
  cfg.branches.forEach((gapsArr,bIdx)=>{
    const wrap = document.createElement('div');
    wrap.className='branch';
    let html='';
    if(cfg.branches.length>1){
      html += '<div class="branch-label">Branch '+String.fromCharCode(65+bIdx)+'</div>';
    }
    html += renderBranchMarkup(gapsArr, bIdx);
    wrap.innerHTML = html;
    boardEl.appendChild(wrap);
  });

  buildTray(cfg);
  attachGapHandlers();
  updateHUD();
  startTimer(cfg.time);
}

function buildTray(cfg){
  const used = new Set();
  cfg.branches.forEach(b=>b.forEach(t=>used.add(t)));
  if(cfg.distractor) used.add(cfg.distractor);
  const types = TYPE_ORDER.filter(t=>used.has(t));
  trayEl.innerHTML = types.map(t=>
    '<div class="tray-item" data-type="'+t+'">'+trayIcon(t)+'<span>'+t+'</span></div>'
  ).join('');
  trayEl.querySelectorAll('.tray-item').forEach(el=>{
    el.addEventListener('pointerdown', onTrayPointerDown);
  });
}

function attachGapHandlers(){
  // handlers are delegated per-gap after fill for switches; drop targets use elementFromPoint
}

/* ============================================================
   DRAG LOGIC
============================================================ */
function onTrayPointerDown(e){
  e.preventDefault();
  ensureAudio(); playPickup();
  const type = e.currentTarget.dataset.type;
  const ghost = document.createElement('div');
  ghost.className='drag-ghost';
  ghost.innerHTML = trayIcon(type);
  document.body.appendChild(ghost);
  positionGhost(e.clientX,e.clientY, ghost);
  state.dragging = {type, ghost};
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragUp);
  window.addEventListener('pointercancel', onDragUp);
}
function positionGhost(x,y,ghost){
  const g = ghost || (state.dragging && state.dragging.ghost);
  if(!g) return;
  g.style.left = x+'px';
  g.style.top = y+'px';
}
function onDragMove(e){
  if(!state.dragging) return;
  positionGhost(e.clientX,e.clientY);
  updateHoverState(e.clientX,e.clientY);
}
function updateHoverState(x,y){
  document.querySelectorAll('.gap-target').forEach(g=>{
    g.classList.remove('hover-match','hover-mismatch');
  });
  const el = document.elementFromPoint(x,y);
  const gapEl = el && el.closest && el.closest('.gap-target');
  if(gapEl && !gapEl.classList.contains('filled') && state.dragging){
    gapEl.classList.add(gapEl.dataset.type===state.dragging.type ? 'hover-match':'hover-mismatch');
  }
}
function onDragUp(e){
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragUp);
  window.removeEventListener('pointercancel', onDragUp);
  document.querySelectorAll('.gap-target').forEach(g=>g.classList.remove('hover-match','hover-mismatch'));
  if(!state.dragging) return;
  const el = document.elementFromPoint(e.clientX,e.clientY);
  const gapEl = el && el.closest && el.closest('.gap-target');
  if(gapEl && !gapEl.classList.contains('filled')){
    if(gapEl.dataset.type === state.dragging.type){
      fillGap(gapEl);
    } else {
      wrongDrop(gapEl);
    }
  }
  state.dragging.ghost.remove();
  state.dragging = null;
}

function fillGap(gapEl){
  const b = +gapEl.dataset.branch, g = +gapEl.dataset.gap;
  const gapState = state.branchStates[b].gaps[g];
  gapState.filled = true;
  gapEl.classList.add('filled');
  gapEl.innerHTML = filledSVG(gapState.type, gapState.closed);
  gapEl.classList.add('pop');
  setTimeout(()=>gapEl.classList.remove('pop'),350);
  playCorrect();
  if(needsToggle(gapState.type)){
    gapEl.classList.add('switchable');
    gapEl.addEventListener('click', onToggleClick);
  }
  checkBranch(b);
}

function onToggleClick(e){
  const gapEl = e.currentTarget;
  const b = +gapEl.dataset.branch, g = +gapEl.dataset.gap;
  const gapState = state.branchStates[b].gaps[g];
  if(!gapState.filled) return;
  gapState.closed = !gapState.closed;
  gapEl.innerHTML = filledSVG(gapState.type, gapState.closed);
  playToggle();
  checkBranch(b);
}

function wrongDrop(gapEl){
  state.wrongAttempts++;
  gapEl.classList.add('shake');
  setTimeout(()=>gapEl.classList.remove('shake'),420);
  playWrong();
}

function checkBranch(b){
  const branch = state.branchStates[b];
  const complete = branch.gaps.every(g=>g.filled && g.closed);
  const svgEl = boardEl.querySelectorAll('.branch-svg')[b];
  svgEl.classList.toggle('lit', complete);
  if(complete && !branch.wasLit){ branch.wasLit = true; playBranchComplete(); }
  if(!complete) branch.wasLit = false;
  checkRoundComplete();
}

function checkRoundComplete(){
  const allDone = state.branchStates.every(b=> b.gaps.every(g=>g.filled && g.closed));
  if(allDone && !state.roundCompleting){
    state.roundCompleting = true;
    clearInterval(state.timerHandle);
    playRoundComplete();
    const cfg = ROUNDS[state.round];
    const timeBonus = state.timeLeft*4;
    const penalty = Math.min(50, state.wrongAttempts*5);
    const roundScore = Math.max(10, roundBaseScore(cfg)+timeBonus-penalty);
    state.score += roundScore;
    showToast('+'+roundScore+' pts');
    updateHUD();
    setTimeout(()=>{
      if(state.round+1 >= ROUNDS.length){
        endGame(true);
      } else {
        state.round++;
        buildBoard();
      }
    }, 1500);
  }
}

/* ============================================================
   TIMER / LIVES
============================================================ */
function startTimer(t){
  state.timeLeft = t;
  updateTimerHUD();
  clearInterval(state.timerHandle);
  state.timerHandle = setInterval(()=>{
    state.timeLeft--;
    updateTimerHUD();
    if(state.timeLeft<=0){
      clearInterval(state.timerHandle);
      loseLife();
    }
  },1000);
}

function loseLife(){
  state.lives--;
  updateHUD();
  playLifeLost();
  document.querySelectorAll('.branch-svg').forEach(el=>{
    el.classList.add('flash-fail');
    setTimeout(()=>el.classList.remove('flash-fail'),500);
  });
  if(state.lives<=0){
    setTimeout(()=>endGame(false), 700);
  } else {
    setTimeout(()=>{ buildBoard(); }, 800);
  }
}

/* ============================================================
   HUD
============================================================ */
function updateHUD(){
  document.getElementById('hudRound').textContent = (state.round+1)+'/'+ROUNDS.length;
  document.getElementById('hudScore').textContent = state.score;
  const livesRow = document.getElementById('hudLives');
  livesRow.innerHTML='';
  for(let i=0;i<START_LIVES;i++){
    const d = document.createElement('div');
    d.className='life-bulb';
    d.innerHTML = bulbLifeIcon(i < state.lives);
    livesRow.appendChild(d);
  }
}
function updateTimerHUD(){
  const el = document.getElementById('hudTimer');
  el.textContent = state.timeLeft;
  const box = document.getElementById('hudTimerBox');
  box.classList.toggle('warn', state.timeLeft<=10);
}
function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.remove('show');
  void toastEl.offsetWidth;
  toastEl.classList.add('show');
}

/* ============================================================
   SCREENS
============================================================ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

function startGame(){
  state.round=0; state.score=0; state.lives=START_LIVES;
  showScreen('game');
  buildBoard();
}

function endGame(won){
  clearInterval(state.timerHandle);
  showScreen('end');
  const pct = state.score / MAX_SCORE;
  let stars = pct>=0.75?3:pct>=0.5?2:pct>=0.25?1:0;
  document.getElementById('endEyebrow').textContent = won ? 'Circuit Complete' : 'Circuit Report';
  document.getElementById('endTitle').textContent = won ? 'Powered Up!' : 'Out of Lives';
  document.getElementById('endScore').textContent = state.score;
  document.getElementById('endRound').textContent = (won ? ROUNDS.length : state.round)+'/'+ROUNDS.length;
  document.getElementById('endLives').textContent = state.lives;

  const starsRow = document.getElementById('starsRow');
  starsRow.innerHTML='';
  for(let i=0;i<3;i++){
    const s = document.createElement('div');
    s.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.27 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z" fill="'+(i<stars?'#ffd166':'#33534b')+'" stroke="'+(i<stars?'#e3963e':'#33534b')+'" stroke-width="1"/></svg>';
    starsRow.appendChild(s.firstChild);
  }
  setTimeout(()=>{
    const svgs = starsRow.querySelectorAll('svg');
    svgs.forEach((s,i)=>{
      if(i<stars){
        setTimeout(()=>{ s.classList.add('won'); playStar(0); }, i*220);
      }
    });
    if(stars>0) playVictory(); else playGameOver();
  }, 150);
}

let slideIdx=0;
function renderSlides(){
  const wrap = document.getElementById('slideWrap');
  wrap.innerHTML = SLIDES.map((s,i)=>
    '<div class="slide'+(i===0?' active':'')+'" data-i="'+i+'">'+s.svg+'<h3>'+s.title+'</h3><p>'+s.text+'</p></div>'
  ).join('');
  const dots = document.getElementById('dots');
  dots.innerHTML = SLIDES.map((s,i)=>'<div class="dot'+(i===0?' active':'')+'" data-i="'+i+'"></div>').join('');
  dots.querySelectorAll('.dot').forEach(d=>d.addEventListener('click',()=>goToSlide(+d.dataset.i)));
}
function goToSlide(i){
  slideIdx = Math.max(0, Math.min(SLIDES.length-1, i));
  document.querySelectorAll('.slide').forEach((s,idx)=>s.classList.toggle('active', idx===slideIdx));
  document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('active', idx===slideIdx));
}

// simple swipe support on slides
(function(){
  let startX=null;
  const wrap = document.getElementById('slideWrap');
  wrap.addEventListener('pointerdown', e=>{ startX=e.clientX; });
  wrap.addEventListener('pointerup', e=>{
    if(startX===null) return;
    const dx = e.clientX-startX;
    if(dx>40) goToSlide(slideIdx-1);
    else if(dx<-40) goToSlide(slideIdx+1);
    startX=null;
  });
})();

})();
